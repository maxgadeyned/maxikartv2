services:
  - type: web
    name: maxikart
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Comma-separated account names that get Dev Tools on the live site (e.g. MAXIM)
      - key: DEV_USERNAMES
        sync: false
